name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: make build
      - run: sh scripts/package-smoke.sh

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: n0ding-bench:ci
      - run: docker run -d --rm --name bench-smoke -p 18080:8080 -e N0DING_BENCH_AUTH_TOKEN=ci-smoke-token n0ding-bench:ci
      - run: |
          for i in $(seq 1 50); do
            curl -fsS http://127.0.0.1:18080/healthz && exit 0
            sleep 0.2
          done
          docker logs bench-smoke
          exit 1
      - if: always()
        run: docker stop bench-smoke || true
