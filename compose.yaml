services:
  bench:
    build: .
    command: ["serve", "--addr", "0.0.0.0:8080", "--db", "/data/bench.db", "--auth-token", "${N0DING_BENCH_AUTH_TOKEN:?set N0DING_BENCH_AUTH_TOKEN}"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - bench-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

volumes:
  bench-data:
